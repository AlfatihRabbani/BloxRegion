# Publishing a GitHub release submits that version to Firefox Add-ons (AMO).
#
# One-time setup — create an API key at https://addons.mozilla.org/developers/addon/api/key/
# and add both values as repository secrets (Settings → Secrets and variables → Actions):
#   AMO_JWT_ISSUER  — the "JWT issuer" value
#   AMO_JWT_SECRET  — the "JWT secret" value
#
# Each release: bump "version" in manifest.json, push, then publish a release tagged
# v<version> (e.g. v2.1). The release text becomes the AMO release notes. After Mozilla
# approves it, Firefox updates everyone automatically.
#
# Or run this workflow by hand (Actions tab) with a tag that has no release yet: it
# creates the release on the commit it runs on, with that version's CHANGELOG.md
# section as its text, then publishes it the same way.

name: Publish to Firefox Add-ons

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v2.0)
        required: true

permissions:
  contents: write

concurrency:
  group: amo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # A manual run for a version that has no release yet creates it (further down).
      - name: Look for the release
        id: release
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.exists == 'true' && env.TAG || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the tag matches manifest.json
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG doesn't match manifest.json version $version. Bump manifest.json or retag the release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check AMO credentials are set
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Add the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets (see the top of this workflow)."
            exit 1
          fi

      # Releases made with the workflow's own token don't start this workflow again.
      - name: Create the release from CHANGELOG.md
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r/g, '').split('\n');
            const start = lines.indexOf('## ' + v);
            if (start < 0) {
              console.log('::error::CHANGELOG.md has no \'## ' + v + '\' section to use as the release text.');
              process.exit(1);
            }
            const out = [];
            for (const line of lines.slice(start + 1)) {
              if (line.startsWith('## ')) break;
              // Join wrapped bullet lines so each point is one line.
              if (/^\s+\S/.test(line) && out.length && out[out.length - 1].trim()) out[out.length - 1] += ' ' + line.trim();
              else out.push(line);
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/notes.md', out.join('\n').trim() + '\n');
          "
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BloxRegion $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Write release notes for AMO
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md || echo "" > release-notes.md
          node -e "
            const fs = require('fs');
            const notes = fs.readFileSync('release-notes.md', 'utf8')
              .replace(/\r/g, '')
              .replace(/\*\*(.+?)\*\*/g, '\$1')
              .replace(/\`([^\`]+)\`/g, '\$1')
              .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '\$1 (\$2)')
              .trim()
              .slice(0, 3000);
            const meta = { version: notes ? { release_notes: { 'en-US': notes } } : {} };
            fs.writeFileSync('amo-metadata.json', JSON.stringify(meta, null, 2));
          "
          cat amo-metadata.json

      - name: Build
        run: |
          npx --yes web-ext@8 build --source-dir . --artifacts-dir web-ext-artifacts --overwrite-dest \
            --ignore-files ".github/**" "web-ext-artifacts/**" "amo-metadata.json" "release-notes.md"
          mv web-ext-artifacts/*.zip "web-ext-artifacts/BloxRegion-${{ steps.version.outputs.version }}.zip"

      - name: Lint
        run: npx --yes addons-linter@latest "web-ext-artifacts/BloxRegion-${{ steps.version.outputs.version }}.zip"

      - name: Submit to Firefox Add-ons (listed)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign --channel listed --source-dir . \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --amo-metadata amo-metadata.json --approval-timeout 0 \
            --ignore-files ".github/**" "web-ext-artifacts/**" "amo-metadata.json" "release-notes.md"

      - name: Attach the package to the release
        run: gh release upload "$TAG" "web-ext-artifacts/BloxRegion-${{ steps.version.outputs.version }}.zip" --clobber
