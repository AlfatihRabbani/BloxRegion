# Runs Mozilla's add-on linter on every push and pull request, so anything Firefox Add-ons
# would reject or warn about shows up before a release instead of during publishing.

name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check scripts parse
        run: |
          for f in background.js regionSelector.js; do node --check "$f"; done
          node -e "for (const f of ['manifest.json', 'json/rules.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - name: Lint the add-on
        run: npx --yes web-ext@8 lint --source-dir . --warnings-as-errors --ignore-files ".github/**"
